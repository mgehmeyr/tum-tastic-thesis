[package]
name = "tum-tastic-thesis"
version = "0.1.7"
compiler = "0.14.0"
repository = "https://github.com/mgehmeyr/tum-tastic-thesis"
entrypoint = "src/lib.typ"
authors = [
  "Santiago Narváez Rivas <https://github.com/santiagonar1>",
  "Manuel Gehmeyr <https://github.com/mgehmeyr>"
]
categories = [ "thesis" ]
disciplines = [ "computer-science" ]
license = "MIT"
description = "Thesis and Dissertation for the TU Munich."
keywords = [ "thesis", "dissertation", "tum" ]
exclude = [
  "tests/**",
  "scripts/**",
  ".github/**",
  ".vscode/**",
  "Justfile"
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
